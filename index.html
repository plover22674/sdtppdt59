<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Premier Site Interactif</title>
</head>
<body>

    <h1>Écrivez votre message !</h1>

    <form action="/traitement-du-formulaire" method="POST"> 
        
        <p>
            <label for="prenom">Votre prénom :</label><br>
            <input type="text" id="prenom" name="prenom_user" required>
        </p>

        <p>
            <label for="commentaire">Laissez votre commentaire :</label><br>
            <textarea id="commentaire" name="commentaire_user" rows="6" cols="40"></textarea>
        </p>

        <p>
            <input type="submit" value="Soumettre">
        </p>

    </form>

</body>
</html>
